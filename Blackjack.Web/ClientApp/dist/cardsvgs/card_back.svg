<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 169.075 244.64">
  <defs>
    <pattern id="diamonds" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#1a3c6e"/>
      <polygon points="10,0 20,10 10,20 0,10" fill="#c0392b" opacity="0.85"/>
    </pattern>
    <pattern id="innerDiamonds" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#1a3c6e"/>
      <polygon points="7,0 14,7 7,14 0,7" fill="#e74c3c" opacity="0.7"/>
    </pattern>
  </defs>
  <!-- Card outline -->
  <rect x="0.5" y="0.5" width="168.075" height="243.64" rx="8" ry="8" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <!-- Outer border band -->
  <rect x="4" y="4" width="161.075" height="236.64" rx="6" ry="6" fill="url(#diamonds)" stroke="#0e2a4d" stroke-width="1.5"/>
  <!-- White inner border -->
  <rect x="14" y="14" width="141.075" height="216.64" rx="4" ry="4" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- Inner pattern area -->
  <rect x="18" y="18" width="133.075" height="208.64" rx="3" ry="3" fill="url(#innerDiamonds)" stroke="none"/>
  <!-- Center medallion background -->
  <ellipse cx="84.5" cy="122.32" rx="30" ry="36" fill="#0e2a4d" stroke="#d4af37" stroke-width="2.5"/>
  <ellipse cx="84.5" cy="122.32" rx="24" ry="30" fill="#1a3c6e" stroke="#d4af37" stroke-width="1"/>
  <!-- Center spade symbol -->
  <g transform="translate(84.5, 115) scale(1.6)" fill="#d4af37">
    <path d="M0,-12 C-2,-10 -9,-3 -9,3 C-9,7 -6,10 -3,10 C-1,10 0,9 0,9 C0,9 1,10 3,10 C6,10 9,7 9,3 C9,-3 2,-10 0,-12Z"/>
    <rect x="-1.5" y="8" width="3" height="6" rx="0.5"/>
    <path d="M-4,14 Q-2,11 0,14 Q2,11 4,14" fill="none" stroke="#d4af37" stroke-width="1.2"/>
  </g>
  <!-- Corner decorations -->
  <circle cx="24" cy="24" r="4" fill="#d4af37" opacity="0.8"/>
  <circle cx="145.075" cy="24" r="4" fill="#d4af37" opacity="0.8"/>
  <circle cx="24" cy="220.64" r="4" fill="#d4af37" opacity="0.8"/>
  <circle cx="145.075" cy="220.64" r="4" fill="#d4af37" opacity="0.8"/>
</svg>
